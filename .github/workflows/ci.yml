name: CI

on:
  push:
    branches: [main, production-readiness]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      # Keep CI hermetic: fixture mode, temp store, no live network writes.
      LIVE_TACHI_ENABLED: "false"
      PROOF_MODE: fixture
      KILL_SWITCH: "true"
      # Do NOT reference runner.temp here. The `runner` context is not available
      # in a job-level `env` block, and referencing it makes GitHub reject the
      # entire workflow with "Unrecognized named-value: 'runner'". That surfaces
      # as a startup failure with ZERO jobs, so nothing runs and no test output
      # appears — it looks like CI is broken rather than misconfigured.
      # /tmp is writable and ephemeral on ubuntu-latest, which is all we need.
      DATA_DIR: /tmp/drawbound-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Intentionally no `version` input: package.json pins the exact pnpm via
        # its `packageManager` field. Passing both makes the action fail with
        # "Multiple versions of pnpm specified" and abort the job.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t drawbound:ci .
