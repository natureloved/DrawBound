<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="db-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a04e"/>
      <stop offset="1" stop-color="#5fb878"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0a0908"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#db-g)" stroke-width="2"/>
  <!-- upper bound: the proof line (dashed, green) -->
  <path d="M18 26 Q32 14 46 24" fill="none" stroke="#5fb878" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.9"/>
  <!-- the drawn credit line (gold, solid) -->
  <path d="M18 38 Q32 48 46 34" fill="none" stroke="#e8a04e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- the bound markers: credit bounded by proof, never outrunning it -->
  <path d="M24 32.5 L24 33.5" stroke="#5fb878" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 42.5 L32 26.5" stroke="#5fb878" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M40 31.5 L40 33.5" stroke="#5fb878" stroke-width="2" stroke-linecap="round"/>
</svg>
